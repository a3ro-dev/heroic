[package]
name = "heroic"
version = "0.1.0"
description = "Wear a superhero on camera"
authors = ["Akshat Singh"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "heroic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
