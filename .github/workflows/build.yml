name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - name: Rust tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Heroic ${{ github.ref_name }}
          releaseBody: Installers for Windows, Linux, macOS and Android. See the README for virtual camera setup.
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: heroic-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
      KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the runner ships the SDK; setup-android's sdkmanager bootstrap breaks on it
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      # Self-update only installs APKs signed with the same key, so every build uses the one
      # debug keystore kept in secrets instead of a fresh one per runner.
      - if: env.KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      # Release build, debug-signed (see app/build.gradle.kts) so it installs straight from the release
      # page. versionCode climbs every run, past local builds (1000), so the app can tell a newer one.
      # ANDROID_HOME comes from the runner's shell, which ${{ env }} can't see
      - run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npx tauri android build --apk --target aarch64 --target x86_64 --config "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"
      - run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk heroic-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: heroic-android
          path: heroic-android.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: heroic-android.apk
      # The feed the app's updater reads: one rolling pre-release, titled with its versionCode.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-nightly --cleanup-tag --yes || true
          gh release create android-nightly heroic-android.apk --prerelease --target "$GITHUB_SHA" --title "Android build $VERSION_CODE" --notes "Latest Android build from main. The app updates itself from here."
